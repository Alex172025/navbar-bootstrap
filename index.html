<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна сторінка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <style>
        html {
            scroll-behavior: smooth;
        }
        .navbar-nav .nav-link {
            color: var(--bs-dark) !important;
            transition: color 0.3s ease;
        }
        .navbar-nav .nav-link.active {
            color: var(--bs-primary) !important;
            font-weight: 500;
        }
        section {
            min-height: 100vh;
            padding-top: 80px; 
        }
        .bg-light-gray { 
            background-color: #f8f9fa; 
        }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#mainNavbar" data-bs-root-margin="0px 0px -40%" data-bs-smooth-scroll="true" tabindex="0">

    <nav id="mainNavbar" class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Бренд</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Меню</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-center flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link" href="#home">Головна</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#about">Про нас</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#services">Послуги</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#contact">Контакти</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Випадаюче меню
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#action1">Дія 1</a></li>
                                <li><a class="dropdown-item" href="#action2">Дія 2</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#action3">Інша дія</a></li>
                            </ul>
                        </li>
                    </ul>
                    
                    <form class="d-flex mt-3 mt-lg-0" role="search">
                        <input class="form-control me-2 rounded-pill" type="search" placeholder="Пошук" aria-label="Пошук">
                        <button class="btn btn-outline-primary rounded-pill px-4" type="submit">Знайти</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <section id="home" class="d-flex align-items-center justify-content-center bg-light-gray">
            <h1 class="display-1 fw-bold">Секція: Головна</h1>
        </section>
        
        <section id="about" class="d-flex align-items-center justify-content-center">
            <h1 class="display-1 fw-bold">Секція: Про нас</h1>
        </section>
        
        <section id="services" class="d-flex align-items-center justify-content-center bg-light-gray">
            <h1 class="display-1 fw-bold">Секція: Послуги</h1>
        </section>
        
        <section id="contact" class="d-flex align-items-center justify-content-center">
            <h1 class="display-1 fw-bold">Секція: Контакти</h1>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
